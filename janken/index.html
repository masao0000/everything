<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>じゃんけん</title>
<style>
  :root { --bg:#f6f7fb; --fg:#222; --card:#fff; --accent:#4a6cf7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#eee; --card:#23262e; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; text-align:center; }
  h1 { margin:8px 0 4px; }
  .sub { opacity:.7; margin:0 0 20px; font-size:14px; }
  .hands { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  button { font-size:48px; width:96px; height:96px; border:none; border-radius:16px; background:var(--card); cursor:pointer; box-shadow:0 2px 6px #0002; transition:transform .1s; }
  button:hover { transform:scale(1.08); }
  .board { margin:24px auto; padding:16px; max-width:360px; background:var(--card); border-radius:16px; }
  .vs { font-size:56px; }
  #result { font-size:24px; font-weight:bold; min-height:32px; }
  .score { margin-top:12px; }
  #reset { font-size:14px; width:auto; height:auto; padding:8px 16px; margin-top:12px; }
</style>
</head>
<body>
  <h1>じゃんけん</h1>
  <p class="sub">Rock, Paper, Scissors — choose your hand!</p>
  <div class="hands">
    <button data-hand="0" aria-label="グー">✊</button>
    <button data-hand="1" aria-label="チョキ">✌️</button>
    <button data-hand="2" aria-label="パー">✋</button>
  </div>
  <div class="board">
    <div class="vs"><span id="you">❔</span> vs <span id="cpu">❔</span></div>
    <div id="result">手を選んでね</div>
    <div class="score">勝ち <b id="w">0</b> / 負け <b id="l">0</b> / あいこ <b id="d">0</b></div>
    <button id="reset">リセット</button>
  </div>
<script>
  const EMOJI = ["✊", "✌️", "✋"];
  const score = { w: 0, l: 0, d: 0 };
  const $ = id => document.getElementById(id);

  function play(you) {
    const cpu = Math.floor(Math.random() * 3);
    // (you - cpu + 3) % 3: 0 = draw, 1 = lose, 2 = win
    const r = (you - cpu + 3) % 3;
    const key = ["d", "l", "w"][r];
    score[key]++;
    $("you").textContent = EMOJI[you];
    $("cpu").textContent = EMOJI[cpu];
    $("result").textContent = ["あいこ (Draw)", "負け… (You lose)", "勝ち！ (You win!)"][r];
    $(key).textContent = score[key];
  }

  document.querySelectorAll("[data-hand]").forEach(b =>
    b.addEventListener("click", () => play(Number(b.dataset.hand))));
  $("reset").addEventListener("click", () => {
    for (const k in score) { score[k] = 0; $(k).textContent = 0; }
    $("you").textContent = $("cpu").textContent = "❔";
    $("result").textContent = "手を選んでね";
  });
</script>
</body>
</html>
