<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイニュース</title>
<style>
  :root { --bg:#f5f6f8; --fg:#1d1f23; --sub:#6b7078; --card:#fff; --line:#e3e5e9; --accent:#2f6fed; --good:#1f9d55; --bad:#d64545; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131519; --fg:#e8e9ec; --sub:#9aa0a8; --card:#1e2127; --line:#2c3038; --accent:#6d9bff; --good:#4cc47f; --bad:#f07070; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; line-height:1.6; }
  header { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); }
  .bar { max-width:760px; margin:0 auto; padding:10px 16px 0; display:flex; align-items:center; gap:8px; }
  h1 { font-size:20px; margin:0; flex:1; }
  .icon { background:none; border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:6px 10px; font-size:15px; cursor:pointer; }
  .tabs { max-width:760px; margin:0 auto; padding:0 16px; display:flex; }
  .tab { flex:1; background:none; border:none; border-bottom:3px solid transparent; color:var(--sub); padding:10px 0; font-size:16px; font-weight:600; cursor:pointer; }
  .tab.on { color:var(--accent); border-color:var(--accent); }
  main { max-width:760px; margin:0 auto; padding:12px 16px 40px; }
  .status { color:var(--sub); font-size:13px; margin:4px 0 12px; }
  .grid { display:grid; gap:12px; }
  @media (min-width:700px) { .grid { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .meta { font-size:12px; color:var(--sub); display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); border-radius:6px; padding:0 6px; }
  .card a { color:var(--fg); text-decoration:none; font-weight:700; font-size:16px; }
  .card a:hover { text-decoration:underline; }
  .sum { margin:0; font-size:14px; color:var(--sub); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .votes { display:flex; gap:8px; margin-top:auto; padding-top:4px; }
  .votes button { background:none; border:1px solid var(--line); border-radius:999px; padding:2px 12px; font-size:16px; cursor:pointer; color:var(--fg); }
  .votes button.up.on { border-color:var(--good); background:color-mix(in srgb, var(--good) 15%, transparent); }
  .votes button.down.on { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 15%, transparent); }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--fg); max-width:420px; width:calc(100% - 32px); }
  dialog input { width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-size:15px; }
  dialog p { font-size:14px; color:var(--sub); }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>マイニュース</h1>
    <button class="icon" id="reload" aria-label="更新">↻ 更新</button>
    <button class="icon" id="settings" aria-label="設定">⚙</button>
  </div>
  <nav class="tabs">
    <button class="tab on" data-tab="foryou">あなた向け</button>
    <button class="tab" data-tab="life">実生活</button>
  </nav>
</header>
<main>
  <div class="status" id="status">読み込み中…</div>
  <div class="grid" id="list"></div>
</main>

<dialog id="dlg">
  <h3>同期の設定</h3>
  <p>スマホとPCで同じ「合言葉」（8文字以上）を入れると、👍👎の学習結果が同期されます。他の人に推測されない言葉にしてください。</p>
  <input id="pass" type="password" autocomplete="off" placeholder="合言葉">
  <p id="syncState"></p>
  <div class="row">
    <button class="icon" id="resetPrefs">学習をリセット</button>
    <button class="icon" id="close">閉じる</button>
    <button class="icon" id="save">保存</button>
  </div>
</dialog>

<script>
const N = 20;
const $ = (s) => document.querySelector(s);
let data = null;
let tab = 'foryou';

// ---- 保存（ブラウザ）----
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const emptyPrefs = () => ({ cats: {}, words: {}, votes: {}, updatedAt: 0 });
let prefs = store.get('news.prefs', emptyPrefs());
let pass = store.get('news.pass', '');

// ---- 好みの学習 ----
// 見出しから漢字・カタカナ・英数字のかたまりを取り出して特徴語にする
const words = (t) => [...new Set(t.match(/[一-龯々]{2,}|[ァ-ヴー]{3,}|[A-Za-z0-9]{3,}/g) || [])];

function vote(a, v) {
  const prev = prefs.votes[a.id]?.v || 0;
  const next = prev === v ? 0 : v;       // 同じボタンをもう一度押すと取り消し
  const d = next - prev;
  prefs.cats[a.category] = (prefs.cats[a.category] || 0) + d;
  for (const w of words(a.title)) {
    prefs.words[w] = (prefs.words[w] || 0) + d;
    if (!prefs.words[w]) delete prefs.words[w];
  }
  if (next) prefs.votes[a.id] = { v: next, t: Date.now() }; else delete prefs.votes[a.id];
  // 古い投票記録は 2000 件まで
  const ids = Object.keys(prefs.votes);
  if (ids.length > 2000) ids.sort((x, y) => prefs.votes[x].t - prefs.votes[y].t).slice(0, ids.length - 2000).forEach((k) => delete prefs.votes[k]);
  prefs.updatedAt = Date.now();
  store.set('news.prefs', prefs);
  pushPrefs();
  render();
}

function score(a) {
  const hours = (Date.now() - new Date(a.date)) / 36e5;
  let s = (prefs.cats[a.category] || 0) * 1.5;
  for (const w of words(a.title)) s += prefs.words[w] || 0;
  if (prefs.votes[a.id]?.v === -1) s -= 100;  // 👎した記事は一番下へ
  return s - hours * 0.15;                      // 新しさも少し考慮
}

// ---- 表示 ----
const ago = (d) => {
  const m = Math.round((Date.now() - new Date(d)) / 6e4);
  return m < 60 ? `${m}分前` : m < 1440 ? `${Math.round(m / 60)}時間前` : `${Math.round(m / 1440)}日前`;
};

function card(a) {
  const el = document.createElement('article');
  el.className = 'card';
  const v = prefs.votes[a.id]?.v || 0;
  el.innerHTML = `
    <div class="meta"><span class="chip"></span><span class="src"></span><span>${ago(a.date)}</span></div>
    <a target="_blank" rel="noopener"></a>
    <p class="sum"></p>
    <div class="votes">
      <button class="up ${v === 1 ? 'on' : ''}" aria-label="好き">👍</button>
      <button class="down ${v === -1 ? 'on' : ''}" aria-label="興味なし">👎</button>
    </div>`;
  el.querySelector('.chip').textContent = a.category;
  el.querySelector('.src').textContent = a.source;
  const link = el.querySelector('a');
  link.href = a.link; link.textContent = a.title;
  const sum = el.querySelector('.sum');
  if (a.summary) sum.textContent = a.summary; else sum.remove();
  el.querySelector('.up').onclick = () => vote(a, 1);
  el.querySelector('.down').onclick = () => vote(a, -1);
  return el;
}

function render() {
  const list = $('#list');
  list.replaceChildren();
  if (!data) return;
  const items = tab === 'foryou'
    ? [...data.articles].sort((x, y) => score(y) - score(x)).slice(0, N)
    : data.life.slice(0, N);  // 実生活は好みを反映しない
  items.forEach((a) => list.append(card(a)));
  $('#status').textContent = `${new Date(data.fetchedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })} 取得 ・ ${items.length}件`;
}

async function load() {
  $('#status').textContent = '最新ニュースを取得中…';
  try {
    const r = await fetch('/api/news');
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  } catch (e) {
    $('#status').textContent = `取得に失敗しました（${e.message}）。↻で再試行してください。`;
  }
}

// ---- 同期 ----
async function pullPrefs() {
  if (!pass) return;
  try {
    const r = await fetch('/api/prefs', { headers: { 'x-sync-key': pass } });
    if (!r.ok) return;
    const remote = await r.json();
    if (remote && remote.updatedAt > prefs.updatedAt) { prefs = remote; store.set('news.prefs', prefs); render(); }
    else if (prefs.updatedAt > (remote?.updatedAt || 0)) pushPrefs();
  } catch {}
}
let timer;
function pushPrefs() {
  if (!pass) return;
  clearTimeout(timer);
  timer = setTimeout(() => fetch('/api/prefs', {
    method: 'PUT', headers: { 'x-sync-key': pass, 'content-type': 'application/json' }, body: JSON.stringify(prefs),
  }).catch(() => {}), 800);
}

// ---- イベント ----
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  store.set('news.tab', tab);
  render();
});
$('#reload').onclick = () => { load(); pullPrefs(); };
$('#settings').onclick = () => {
  $('#pass').value = pass;
  $('#syncState').textContent = pass ? '同期：オン' : '同期：オフ';
  $('#dlg').showModal();
};
$('#close').onclick = () => $('#dlg').close();
$('#save').onclick = async () => {
  const p = $('#pass').value.trim();
  if (p && p.length < 8) { $('#syncState').textContent = '合言葉は8文字以上にしてください。'; return; }
  pass = p; store.set('news.pass', pass);
  $('#syncState').textContent = '確認中…';
  if (pass) {
    const r = await fetch('/api/prefs', { headers: { 'x-sync-key': pass } }).catch(() => null);
    if (!r || r.status === 503) { $('#syncState').textContent = 'サーバーのDBが未設定です（Upstashを追加してください）。'; return; }
    await pullPrefs();
  }
  $('#dlg').close();
};
$('#resetPrefs').onclick = () => {
  if (!confirm('👍👎の学習をすべて消しますか？')) return;
  prefs = { ...emptyPrefs(), updatedAt: Date.now() };
  store.set('news.prefs', prefs); pushPrefs(); render();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now() - new Date(data.fetchedAt) > 5 * 6e4) load(); });

const saved = store.get('news.tab', 'foryou');
document.querySelector(`.tab[data-tab="${saved}"]`)?.click();
load();
pullPrefs();
</script>
</body>
</html>
